name: CI/CD

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

env:
  PHP_VERSION: '8.3'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, bcmath, pcntl, zip, intl, mbstring
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit (fail on HIGH)
        run: composer audit --format=json | php -r '
          $audit = json_decode(file_get_contents("php://stdin"), true);
          $high = array_filter($audit["advisories"] ?? [], fn($a) => in_array(($a[0]["severity"] ?? ""), ["high", "critical"]));
          if (count($high) > 0) { echo "HIGH/CRITICAL vulnerabilities found:\n"; print_r($high); exit(1); }
          echo "No HIGH/CRITICAL vulnerabilities found.\n";
        '

      - name: Instagram must never call hide API
        run: |
          if grep -rn "hidden=true\|is_hidden.*true\|hideComment.*api\|/hide" app/Services/SocialMedia/Instagram; then
            echo "::error::Instagram service must never call hide API"
            exit 1
          fi
          echo "Instagram hide check passed"

      - name: TikTok must never call hide API
        run: |
          if grep -rn "hidden=true\|is_hidden.*true\|hideComment.*api\|/hide" app/Services/SocialMedia/TikTok; then
            echo "::error::TikTok service must never call hide API"
            exit 1
          fi
          echo "TikTok hide check passed"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tidemark_test
          POSTGRES_USER: tidemark
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tidemark"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, bcmath, pcntl, zip, intl, mbstring
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tidemark_test
          DB_USERNAME: tidemark
          DB_PASSWORD: secret

      - name: Seed test data
        run: php artisan db:seed --class=RolePermissionSeeder
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tidemark_test
          DB_USERNAME: tidemark
          DB_PASSWORD: secret

      - name: Run tests with coverage
        run: php artisan test --parallel --coverage-clover=coverage.xml
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tidemark_test
          DB_USERNAME: tidemark
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: redis
          QUEUE_CONNECTION: sync

      - name: Check coverage threshold
        run: |
          COVERAGE=$(php -r '
            $xml = simplexml_load_file("coverage.xml");
            $metrics = $xml->project->metrics;
            $total = (int)$metrics["elements"];
            $covered = (int)$metrics["coveredelements"];
            echo $total > 0 ? round(($covered / $total) * 100, 1) : 0;
          ')
          echo "Code coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

  deploy-staging:
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    needs: [security-audit, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: staging-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ secrets.ECS_TASK_DEFINITION_STAGING }}
          container-name: tidemark-api
          image: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:staging-${{ github.sha }}

      - name: Deploy to staging ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_STAGING }}
          cluster: ${{ secrets.ECS_CLUSTER_STAGING }}
          wait-for-service-stability: true

      - name: Smoke test
        run: |
          for i in {1..10}; do
            if curl -sf https://api-staging.tidemarkmedia.com/health; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Smoke test failed after 10 attempts"
          exit 1

  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [security-audit, test]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: prod-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ secrets.ECS_TASK_DEFINITION_PRODUCTION }}
          container-name: tidemark-api
          image: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:prod-${{ github.sha }}

      - name: Deploy to production ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_PRODUCTION }}
          cluster: ${{ secrets.ECS_CLUSTER_PRODUCTION }}
          wait-for-service-stability: true

      - name: Smoke test
        run: |
          for i in {1..10}; do
            if curl -sf https://api.tidemarkmedia.com/health; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Smoke test failed after 10 attempts"
          exit 1

      - name: Notify Slack on success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ tidemark-api deployed to production\nCommit: \`${{ github.sha }}\`\nBy: ${{ github.actor }}\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ tidemark-api production deploy FAILED\nCommit: \`${{ github.sha }}\`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
